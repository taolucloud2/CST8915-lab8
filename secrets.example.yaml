# Make a private copy outside the repository before filling in Azure keys.
# The Brightspace download supplies these same Secrets for the direct OpenAI path.
apiVersion: v1
kind: Secret
metadata:
  name: openai-gpt-api-secret
type: Opaque
stringData:
  OPENAI_GPT_API_KEY: "<text-resource-key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-dalle-api-secret
type: Opaque
stringData:
  OPENAI_DALLE_API_KEY: "<image-resource-key>"
